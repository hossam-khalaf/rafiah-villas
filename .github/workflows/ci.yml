name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # Must match the Node/npm that generated package-lock.json (npm 11).
        # npm 10 (Node 20) recomputes the tree and fails `npm ci` sync check.
        node-version: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint
      
    - name: Run Type Checker
      run: npx tsc --noEmit
      
    # Disabling the build step in CI for now because Next.js build requires valid environment variables
    # (like Sanity project ID) which might not be configured in GitHub Secrets yet.
    # Vercel will handle the actual production build.
    # - name: Build Test
    #   run: npm run build
